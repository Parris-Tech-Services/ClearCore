name: Build ClearCore static hotfix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for JoshPlatform Pages
        run: npm run build
        env:
          PUBLIC_BASE: /JoshPlatform/clearcore/

      - name: Add SPA fallback
        run: cp dist/public/index.html dist/public/404.html

      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: clearcore-static
          path: dist/public
          if-no-files-found: error
